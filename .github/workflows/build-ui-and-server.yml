name: Meshery UI and Server
permissions: read-all
jobs:
  ui-build:
    name: UI build
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: Build meshery-ui and provider-ui
      run: |
        make ui-build
    - name: Upload meshery-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: meshery-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Upload provider-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: provider-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/provider-ui/out
  tests-ui-e2e:
    needs:
    - ui-build
    name: UI end-to-end tests
    environment: staging-playground
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: source entry - pull_request_target checkout of PR head SHA"
        EVENT_NAME=$(printf '%s' '${{ toJSON(github.event_name) }}' | tr -d '"')
        REPO=$(printf '%s' '${{ toJSON(github.repository) }}' | tr -d '"')
        PR_SHA=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
        printf '%s\n' "GERALT_DBG event_name=${EVENT_NAME}"
        printf '%s\n' "GERALT_DBG github_repository=${REPO}"
        printf '%s\n' "GERALT_DBG pr_head_sha=${PR_SHA:-unknown}"
      continue-on-error: true
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.13.0
      with:
        cluster_name: kind-cluster
    - name: Setup Go
      uses: actions/setup-go@master
      with:
        go-version: '1.25'
        cache-dependency-path: '**/*.sum'
        cache: true
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: Download meshery-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: meshery-ui
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Download provider-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: provider-ui
        path: /home/runner/work/meshery/meshery/provider-ui/out
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: attacker-controlled tree consumed by make server"
        HEAD_SHA=$(git rev-parse HEAD 2>/dev/null || echo no-git)
        PR_SHA=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
        printf '%s\n' "GERALT_DBG checked_out_sha=${HEAD_SHA}"
        printf '%s\n' "GERALT_DBG pr_head_sha=${PR_SHA:-unknown}"
        if [ -n "${PR_SHA}" ] && [ "${HEAD_SHA}" = "${PR_SHA}" ]; then printf '%s\n' "GERALT_DBG checkout_matches_pr=yes"; else printf '%s\n' "GERALT_DBG checkout_matches_pr=no"; fi
        if [ -f Makefile ]; then grep -q '^server:' Makefile && printf '%s\n' "GERALT_DBG server_target_present=yes" || printf '%s\n' "GERALT_DBG server_target_present=no"; else printf '%s\n' "GERALT_DBG Makefile_missing=yes"; fi
      continue-on-error: true
    - name: Run Meshery UI and Server
      run: |
        make server &
        sleep 90
    - name: Install Playwright
      run: make ui-setup-ci
    - name: Install Playwright Browsers
      run: make ui-test-setup
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: before sink make ui-test-e2e-ci"
        if [ -f Makefile ]; then grep -q '^ui-test-e2e-ci:' Makefile && printf '%s\n' "GERALT_DBG sink_target_present=yes" || printf '%s\n' "GERALT_DBG sink_target_present=no"; else printf '%s\n' "GERALT_DBG Makefile_missing=yes"; fi
        EVENT_NAME=$(printf '%s' '${{ toJSON(github.event_name) }}' | tr -d '"')
        REPO=$(printf '%s' '${{ toJSON(github.repository) }}' | tr -d '"')
        printf '%s\n' "GERALT_DBG event_name=${EVENT_NAME}"
        printf '%s\n' "GERALT_DBG github_repository=${REPO}"
        printf '%s\n' "GERALT_DBG secrets_are_step_scoped_env=note"
      continue-on-error: true
    - name: Run Playwright End-to-End Tests
      env:
        MESHERY_SERVER_URL: http://localhost:9081
        REMOTE_PROVIDER_URL: https://cloud.layer5.io
        REMOTE_PROVIDER_USER_EMAIL: ${{ secrets.REMOTE_PROVIDER_TEST_USER_EMAIL }}
        REMOTE_PROVIDER_USER_PASSWORD: ${{ secrets.REMOTE_PROVIDER_TEST_USER_PASS }}
        PROVIDER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
      run: make ui-test-e2e-ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - master
    paths-ignore:
    - docs/**
    - mesheryctl/**
    - '*.md'
    - '*.github/**'
    - Makefile
  push:
    branches:
    - master
    paths-ignore:
    - docs/**
    - '*.md'
    - '*.github/**'
