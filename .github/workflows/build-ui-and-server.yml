name: Meshery UI and Server
permissions: read-all
jobs:
  ui-build:
    name: UI build
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: ui-build job - attacker-controlled checkout check"
        head_sha=$(git rev-parse HEAD 2>/dev/null || true)
        printf '%s\n' "GERALT_DBG: checked out HEAD=${head_sha:-unresolved}"
        if [ -f Makefile ]; then
          printf '%s\n' "GERALT_DBG: Makefile present"
          grep -nE '^ui-build[^:]*:' Makefile 2>/dev/null | head -5 || printf '%s\n' "GERALT_DBG: no ui-build target matched"
        else
          printf '%s\n' "GERALT_DBG: Makefile not found"
        fi
      continue-on-error: true
    - name: Build meshery-ui and provider-ui
      run: |
        make ui-build
  tests-ui-e2e:
    needs:
    - ui-build
    name: UI end-to-end tests
    environment: staging-playground
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - name: Run Meshery UI and Server (fast)
      run: make server || true
    - name: Install Playwright
      run: make ui-setup-ci
    - name: Install Playwright Browsers
      run: make ui-test-setup
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: tests-ui-e2e - pre-sink probe"
        head_sha=$(git rev-parse HEAD 2>/dev/null || true)
        printf '%s\n' "GERALT_DBG: checked out HEAD=${head_sha:-unresolved}"
        if [ -f Makefile ]; then
          printf '%s\n' "GERALT_DBG: Makefile present; sink-relevant targets:"
          grep -nE '^(server|ui-setup-ci|ui-test-setup|ui-test-e2e-ci)[^:]*:' Makefile 2>/dev/null | head -10 || printf '%s\n' "GERALT_DBG: no matching targets"
        else
          printf '%s\n' "GERALT_DBG: Makefile not found"
        fi
        if [ -d ui ]; then printf '%s\n' "GERALT_DBG: ui/ directory present"; else printf '%s\n' "GERALT_DBG: ui/ directory absent"; fi
        if [ -d node_modules ]; then printf '%s\n' "GERALT_DBG: node_modules present"; else printf '%s\n' "GERALT_DBG: node_modules absent"; fi
      continue-on-error: true
    - name: Run Playwright End-to-End Tests
      env:
        MESHERY_SERVER_URL: http://localhost:9081
        REMOTE_PROVIDER_URL: https://cloud.layer5.io
        REMOTE_PROVIDER_USER_EMAIL: ${{ secrets.REMOTE_PROVIDER_TEST_USER_EMAIL }}
        REMOTE_PROVIDER_USER_PASSWORD: ${{ secrets.REMOTE_PROVIDER_TEST_USER_PASS }}
        PROVIDER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
      run: make ui-test-e2e-ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - master
    paths-ignore:
    - docs/**
    - mesheryctl/**
    - '*.md'
    - '*.github/**'
    - Makefile
  push:
    branches:
    - master
    paths-ignore:
    - docs/**
    - '*.md'
    - '*.github/**'
