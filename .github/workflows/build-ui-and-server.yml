name: Meshery UI and Server
permissions: read-all
jobs:
  ui-build:
    name: UI build
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 1
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: Build meshery-ui and provider-ui
      run: |
        make ui-build
    - name: Upload meshery-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: meshery-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Upload provider-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: provider-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/provider-ui/out
  tests-ui-e2e:
    needs:
    - ui-build
    name: UI end-to-end tests
    environment: staging-playground
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: source=github.event.pull_request.head.sha via pull_request_target checkout"
        printf 'GERALT_DBG event_name=%s\n' "${GITHUB_EVENT_NAME:-unset}"
        printf 'GERALT_DBG head_sha=%s\n' "$(jq -r '.pull_request.head.sha // "none"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo unreadable)"
        printf 'GERALT_DBG base_ref=%s\n' "$(jq -r '.pull_request.base.ref // "none"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo unreadable)"
      continue-on-error: true
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 1
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - name: Setup Go
      uses: actions/setup-go@master
      with:
        go-version: '1.25'
        cache-dependency-path: '**/*.sum'
        cache: true
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: Download meshery-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: meshery-ui
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Download provider-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: provider-ui
        path: /home/runner/work/meshery/meshery/provider-ui/out
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: attacker-controlled tree about to execute via make server"
        printf 'GERALT_DBG head_sha=%s\n' "$(jq -r '.pull_request.head.sha // "none"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo unreadable)"
        printf 'GERALT_DBG server_main_present=%s\n' "$([ -f server/cmd/main.go ] && echo yes || echo no)"
        printf 'GERALT_DBG makefile_present=%s\n' "$([ -f Makefile ] && echo yes || echo no)"
        printf 'GERALT_DBG ui_out_present=%s\n' "$([ -d ui/out ] && echo yes || echo no)"
      continue-on-error: true
    - name: Run Meshery UI and Server
      run: |
        make server &
        sleep 90
    - name: Install Playwright
      run: make ui-setup-ci
    - name: Install Playwright Browsers
      run: make ui-test-setup
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: sink make ui-test-e2e-ci (attacker npm scripts, secrets mapped into env)"
        printf 'GERALT_DBG secret_email_set=%s\n' "$([ -n "${REMOTE_PROVIDER_TEST_USER_EMAIL:-}" ] && echo yes || echo no)"
        printf 'GERALT_DBG secret_pass_set=%s\n' "$([ -n "${REMOTE_PROVIDER_TEST_USER_PASS:-}" ] && echo yes || echo no)"
        printf 'GERALT_DBG token_set=%s\n' "$([ -n "${PROVIDER_TOKEN:-}" ] && echo yes || echo no)"
        printf 'GERALT_DBG ui_package_json_present=%s\n' "$([ -f ui/package.json ] && echo yes || echo no)"
      continue-on-error: true
    - name: Run Playwright End-to-End Tests
      env:
        MESHERY_SERVER_URL: http://localhost:9081
        REMOTE_PROVIDER_URL: https://cloud.layer5.io
        REMOTE_PROVIDER_USER_EMAIL: ${{ secrets.REMOTE_PROVIDER_TEST_USER_EMAIL }}
        REMOTE_PROVIDER_USER_PASSWORD: ${{ secrets.REMOTE_PROVIDER_TEST_USER_PASS }}
        PROVIDER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
      run: make ui-test-e2e-ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - master
    paths-ignore:
    - docs/**
    - mesheryctl/**
    - '*.md'
    - '*.github/**'
    - Makefile
  push:
    branches:
    - master
    paths-ignore:
    - docs/**
    - '*.md'
    - '*.github/**'
