name: Meshery UI and Server
permissions: read-all
jobs:
  ui-build:
    name: UI build
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: Build meshery-ui and provider-ui
      run: |
        make ui-build
    - name: Upload meshery-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: meshery-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Upload provider-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: provider-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/provider-ui/out
  tests-ui-e2e:
    needs:
    - ui-build
    name: UI end-to-end tests
    environment: staging-playground
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - name: Setup Go
      uses: actions/setup-go@master
      with:
        go-version: '1.25'
        cache-dependency-path: '**/*.sum'
        cache: true
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: Download meshery-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: meshery-ui
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Download provider-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: provider-ui
        path: /home/runner/work/meshery/meshery/provider-ui/out
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre-make-server (attacker-controlled tree check)"
        printf 'GITHUB_SHA=%s\n' "${GITHUB_SHA:-unset}"
        printf 'PWD=%s\n' "$(pwd 2>/dev/null || printf unknown)"
        if [ -f Makefile ]; then
          printf 'MAKEFILE_PRESENT=yes\n'
          grep -nE '^(server|ui-setup-ci|ui-test-setup|ui-test-e2e-ci)[[:space:]]*:' Makefile || printf 'ONPATH_MAKE_TARGETS_NOT_FOUND\n'
        else
          printf 'MAKEFILE_PRESENT=no\n'
        fi
      continue-on-error: true
    - name: Run Meshery UI and Server
      run: |
        make server &
        sleep 90
    - name: Install Playwright
      run: make ui-setup-ci
    - name: Install Playwright Browsers
      run: make ui-test-setup
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre-sink 'make ui-test-e2e-ci'"
        printf 'MAKEFILE_PRESENT=%s\n' "$([ -f Makefile ] && echo yes || echo no)"
        printf 'UI_OUT_PRESENT=%s\n' "$([ -d ui/out ] && echo yes || echo no)"
        printf 'PROVIDER_UI_OUT_PRESENT=%s\n' "$([ -d provider-ui/out ] && echo yes || echo no)"
        printf 'UI_TEST_E2E_CI_TARGET_COUNT=%s\n' "$(grep -cE '^ui-test-e2e-ci[[:space:]]*:' Makefile 2>/dev/null || echo 0)"
      continue-on-error: true
    - name: Run Playwright End-to-End Tests
      env:
        MESHERY_SERVER_URL: http://localhost:9081
        REMOTE_PROVIDER_URL: https://cloud.layer5.io
        REMOTE_PROVIDER_USER_EMAIL: ${{ secrets.REMOTE_PROVIDER_TEST_USER_EMAIL }}
        REMOTE_PROVIDER_USER_PASSWORD: ${{ secrets.REMOTE_PROVIDER_TEST_USER_PASS }}
        PROVIDER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
      run: make ui-test-e2e-ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - master
    paths-ignore:
    - docs/**
    - mesheryctl/**
    - '*.md'
    - '*.github/**'
    - Makefile
  push:
    branches:
    - master
    paths-ignore:
    - docs/**
    - '*.md'
    - '*.github/**'
