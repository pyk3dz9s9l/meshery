name: Meshery Snapshot Service
permissions:
  actions: read
  contents: write
  security-events: write
  statuses: write
  pull-requests: write
  id-token: write
jobs:
  KanvasScreenshot:
    runs-on: ubuntu-24.04
    outputs:
      resource_url: ${{ steps.test_result.outputs.resource_url }}
    steps:
    - name: Set PR number
      run: |
        export pull_number=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
        echo "PULL_NO=$pull_number" >> $GITHUB_ENV
    - uses: actions/checkout@v6.0.3
    - uses: actions/checkout@v6.0.3
      with:
        path: action
        repository: layer5labs/kanvas-snapshot
    - id: test_result
      uses: layer5labs/Kanvas-Snapshot@v0.2.43
      with:
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        mesheryToken: ${{ secrets.MESHERY_TOKEN }}
        prNumber: ${{ env.PULL_NO }}
        application_type: Kubernetes Manifest
        filePath: ${{ inputs.fileName == '' && 'install/deployment_yamls/k8s' || inputs.fileName }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
  workflow_call:
    inputs:
      fileName:
        description: Relative file path from the root directory
        required: true
        type: string
    outputs:
      resource_url:
        description: The URL of the generated resource.
        value: ${{ jobs.KanvasScreenshot.outputs.resource_url }}
